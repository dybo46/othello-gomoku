<!doctype html><html lang="ja"><meta charset="utf-8"><title>結果レイアウト確認</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/result.css"><link rel="stylesheet" href="/layout.css"><style>body{padding:12px}#tools{max-width:600px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}#tools label{display:flex;gap:5px;align-items:center}#fixture{margin:0 auto;width:320px}#fixture .tally{animation:none!important}#report{white-space:pre-wrap;max-width:600px;margin:10px auto;color:#cfe8d4;font:12px monospace}</style>
<div id="tools"><label>盤サイズ<select id="size"><option>264</option><option>296</option><option selected>320</option><option>372</option><option>396</option><option>476</option></select></label><label>黒<input id="black" type="number" min="0" max="64" value="42" size="3"></label><label>白<input id="white" type="number" min="0" max="64" value="22" size="3"></label><button id="show">表示</button><button id="run">全石数の配置を検証</button></div>
<div id="fixture" class="board-frame" data-skin="F1"><div id="result" class="board-overlay result"></div></div><p id="report">確認準備完了</p>
<script type="module">
import {buildResult,updateTally} from '/result-view.js';
import {resultLabel} from '/match-labels.js';
const box=document.querySelector('#result'),frame=document.querySelector('#fixture'),report=document.querySelector('#report');
function show(score=[+document.querySelector('#black').value,+document.querySelector('#white').value],size=+document.querySelector('#size').value){frame.style.width=size+'px';buildResult(box,{normal:true,score,reason:'終局',buttonLabel:'待受に戻る',onClose:()=>{},replayLabel:'次の試合を見る',onReplay:()=>{}});updateTally(box,score,64);box.querySelector('.winner-text').textContent=resultLabel(score[0]===score[1]?0:score[0]>score[1]?1:2,'名無しさん１',0);}
function check(){const outer=box.getBoundingClientRect(),nodes=[...box.children],rects=nodes.map(n=>n.getBoundingClientRect());for(let i=0;i<rects.length;i++){const r=rects[i];if(r.top<outer.top-.5||r.bottom>outer.bottom+.5||r.left<outer.left-.5||r.right>outer.right+.5)throw Error('領域外: '+nodes[i].className);if(i&&r.top<rects[i-1].bottom-.5)throw Error('領域の重なり: '+nodes[i].className);}
for(const tray of box.querySelectorAll('.count-tray')){const r=tray.getBoundingClientRect();for(const dot of tray.children){const d=dot.getBoundingClientRect();if(d.top<r.top-.5||d.bottom>r.bottom+.5||d.left<r.left-.5||d.right>r.right+.5)throw Error('石が領域外');if(Math.abs(d.width-d.height)>.6)throw Error('石が楕円');if(d.width<1.95||d.height<1.95)throw Error('石が小さすぎる');}}
for(const selector of ['h2','.result-numbers','.winner-text','.result-buttons']){const n=box.querySelector(selector);if(n.scrollHeight>n.clientHeight+1||n.scrollWidth>n.clientWidth+1)throw Error('文字の欠け: '+selector);}}
document.querySelector('#show').onclick=()=>{show();try{check();report.textContent='表示OK：数字・勝者・ボタンの重なりなし';}catch(e){report.textContent=e.message;}};
document.querySelector('#run').onclick=async()=>{const sizes=[264,296,320,372,396,476],record={cases:0,sizes,scorePatterns:2145,failures:[]};document.querySelector('#run').disabled=true;
try{for(const size of sizes){for(let black=0;black<=64;black++)for(let white=0;white<=64-black;white++){show([black,white],size);try{check();}catch(e){if(record.failures.length<12)record.failures.push({size,black,white,error:e.message});record.failureCount=(record.failureCount||0)+1;}record.cases++;if(record.cases%100===0){report.textContent=`検証中 ${record.cases} / 12870`;await new Promise(requestAnimationFrame);}}}record.ok=!record.failures.length;report.textContent=JSON.stringify(record,null,2);}finally{show();document.querySelector('#run').disabled=false;}};
show();
</script></html>
